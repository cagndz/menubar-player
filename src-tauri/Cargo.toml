[package]
name = "menubar-player"
version = "0.1.1"
description = "Audio player for YouTube in the macOS menu bar"
authors = ["Carlos Agúndez"]
license = "MIT"
edition = "2021"

[lib]
name = "menubar_player_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.3 is the first release with the `backgroundThrottling` window option.
# `macos-private-api` allows the transparent window the rounded popover needs;
# it rules out the Mac App Store.
tauri = { version = "2.3", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-single-instance = "2"
# The system's own login items (macOS 13+), so the app is listed there by name.
smappservice-rs = "0.1"
# Only to kill yt-dlp together with the helpers it starts, when it hangs.
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
